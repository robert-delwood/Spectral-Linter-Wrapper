<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrollable Image</title>
    <style>
        .scroll-container {
            width: 800px;         /* Set the container width */
            height: 500px;        /* Set the container height */
            overflow: scroll;     /* Enable both vertical and horizontal scrolling */
            border: 2px solid #ccc; /* Optional: add a border */
        }
        
        .scroll-container img {
            width: 800px;         /* Set the image width larger than the container */
            height: 800px;        /* Set the image height larger than the container */
        }
    </style>
</head>
<body>

    <div class="scroll-container">
		<img src="site_graphic.jpeg" alt="Scrollable Image">
    </div>

</body>
</html>
